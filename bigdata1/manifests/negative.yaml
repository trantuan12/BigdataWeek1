apiVersion: v1
kind: Pod
metadata:
  name: quota-negative
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
  containers:
  - name: client
    image: s3client:v1
    imagePullPolicy: IfNotPresent
    command: ["sleep", "10"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: "3"
        memory: 128Mi
      limits:
        cpu: "3"
        memory: 256Mi
