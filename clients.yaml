apiVersion: v1
kind: Pod
metadata:
  name: owner
  labels:
    role: owner
    access: s3
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
  containers:
  - name: client
    image: ${CLIENT_IMAGE}
    imagePullPolicy: IfNotPresent
    command: [sleep, infinity]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env:
    - name: S3_ENDPOINT
      value: 'http://objects:8333'
    - name: PRINCIPAL
      value: 'owner'
    envFrom:
    - secretRef:
        name: s3-owner
---
